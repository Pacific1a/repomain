<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Bot Config</title>
</head>
<body>
    <h1>Balance Test</h1>
    <div id="output"></div>
    
    <script>
        const output = document.getElementById('output');
        
        function log(msg) {
            console.log(msg);
            output.innerHTML += `<div>${msg}</div>`;
        }
        
        log('Testing config...');
        log('window.location.hostname: ' + window.location.hostname);
        log('window.location.origin: ' + window.location.origin);
        
        // Simulate config.js logic
        let SERVER_URL;
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            SERVER_URL = 'http://localhost:3000';
        }
        else if (window.location.hostname.includes('vercel.app') || window.location.hostname.includes('netlify.app')) {
            SERVER_URL = 'https://duopartners.xyz';
        }
        else {
            SERVER_URL = window.location.origin;
        }
        
        log('Calculated SERVER_URL: ' + SERVER_URL);
        
        // Test fetch balance
        log('Testing balance API...');
        
        fetch(SERVER_URL + '/api/balance/1889923046')
            .then(res => res.json())
            .then(data => {
                log('✅ Balance API response:');
                log(JSON.stringify(data, null, 2));
            })
            .catch(err => {
                log('❌ Error: ' + err.message);
            });
    </script>
</body>
</html>
